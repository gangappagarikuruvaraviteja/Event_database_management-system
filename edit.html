<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRUD Operations in the Project of the MyDay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.4/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-DQvkBjpPgn7RC31MCQoOeC9TI2kdqa4+BSgNMNj8v77fdC77Kj5zpWFTJaaAoMbC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="container ">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark ">
            <a class="navbar-brand m-2" href="#">CRUD MINI PROJECT</a>
        </nav>

        <div class="container mt-3">
            <div class="row">
                <div class="col-md-4">
                    <h3 class="bg-dark text-white text-center">Insert Student Details</h3>
                    <br>
                    <form action="/insert" method="post">{% csrf_token %}
                        <div>
                            <input type="text" class="form-control mt-3" placeholder="Enter the student Name " name="name" value={{d.name}}>
                        </div>

                        <div>
                            <input type="text" class="form-control mt-3" placeholder="Enter the Student Email " name="email" value={{d.email}}>
                        </div>
                        <div>
                            <input type="number" class="form-control mt-3" placeholder="Enter the Student Age " name="age" value={{d.age}}>
                        </div>

                        <div class="container mt-3">
                            <select class="form-control" name="gender">
                                <option selected>{{d.gender}}</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>
                        <div class="mt-3">
                            <button type="submit" class="btn btn-danger w-100 ">Update</button>
                        </div>

                    </form>
                </div>


            </div>
        </div>

    </div>


</body>

</html>
