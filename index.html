<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRUD Operations in the Project of the MyDay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.4/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-DQvkBjpPgn7RC31MCQoOeC9TI2kdqa4+BSgNMNj8v77fdC77Kj5zpWFTJaaAoMbC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        #main {
            text-align: center;
            color: red;
            align-items: center;
        }
    </style>
</head>

<body>
    <div class="container ">

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark ">
            <a class="navbar-brand m-2 text-center" href="#" id="main">
                <marquee>CRUD OPERATIONS</marquee>
            </a>

        </nav>

        <div class="container mt-3">
            <div class="row">
                <div class="col-md-4">
                    <h3 class="bg-dark text-white text-center">Enter the Event Partipacient Details</h3>
                    <br>
                    <form action="/insert" method="post">{% csrf_token %}
                        <div>
                            <input type="text" class="form-control mt-3" placeholder="Enter the student Name " name="name">
                        </div>

                        <div>
                            <input type="text" class="form-control mt-3" placeholder="Enter the Student Email " name="email">
                        </div>
                        <div>
                            <input type="number" class="form-control mt-3" placeholder="Enter the Student Age " name="age">
                        </div>

                        <div class="container mt-3">
                            <select class="form-control" name="gender">
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>
                        <div class="mt-3">
                            <button type="submit" class="btn btn-success w-100">Submit</button>
                        </div>

                    </form>
                </div>
                <div class="col-md-8">
                    <h2 class="text-center bg-dark text-white">Student Details</h2>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Age</th>
                                <th>Gender</th>
                                <th>Edit</th>
                                <th>Delete</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for x in data %}
                            <tr>
                                <td>{{x.id}}</td>
                                <td>{{x.name}}</td>
                                <td>{{x.email}}</td>
                                <td>{{x.age}}</td>
                                <td>{{x.gender}}</td>
                                <td>
                                    <a button href="/update/{{x.id}}" class="btn btn-outline-primary">Edit</a></button>
                                </td>
                                <td>
                                    <a button href="/delete/{{x.id}}" class="btn btn-outline-danger">Delete</a></button>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>


</body>

</html>
